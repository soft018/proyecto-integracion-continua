name: gestion-ci

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestion-productos:jenkins
    container_name: gestion-ci-app
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-productos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave}
      POSTGRES_DB: ${POSTGRES_DB:-productos_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gestion_ci_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/salud').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: "no"

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: gestion-productos-db:jenkins
    container_name: gestion-ci-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-productos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave}
      POSTGRES_DB: ${POSTGRES_DB:-productos_db}
    volumes:
      - gestion_ci_postgres_data:/var/lib/postgresql/data
    networks:
      gestion_ci_net:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"

networks:
  gestion_ci_net:
    name: gestion_ci_net
    driver: bridge

volumes:
  gestion_ci_postgres_data:
    name: gestion_ci_postgres_data
